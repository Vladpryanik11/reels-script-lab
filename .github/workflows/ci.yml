name: Validate Reels Script Lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check immutable methodology and full source presence
        run: python scripts/verify_baseline.py --strict
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
